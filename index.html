<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#16c8d8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wavegram</title>
    <script>
      // Apply the theme before first paint to avoid a flash. Dark is the default; a persisted
      // choice overrides it. Mirrors getInitialTheme in src/ui/lib/useTheme.ts.
      try {
        var t = localStorage.getItem('wavegram-theme')
        document.documentElement.classList.toggle('dark', t !== 'light')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
